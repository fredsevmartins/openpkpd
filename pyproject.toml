[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openpkpd"
version = "1.0.0"
description = "Deterministic pharmacokinetic modeling, estimation and diagnostics with a local MCP interface"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "OpenPKPD contributors"}]
dependencies = ["numpy>=1.24", "scipy>=1.10", "mcp>=2,<3", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
openpkpd-mcp = "openpkpd.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
